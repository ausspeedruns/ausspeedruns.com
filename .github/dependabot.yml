version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      cooldown:
          default-days: 3
      groups:
          payload:
              patterns:
                  - payload
                  - "@payloadcms/*"
          mantine:
              patterns:
                  - "@mantine/*"
          next-react:
              patterns:
                  - next
                  - react
                  - react-dom
                  - "@types/react"
                  - "@types/react-dom"
          react-email:
              patterns:
                  - react-email
                  - "@react-email/*"
          dev-dependencies:
              dependency-type: development
              update-types:
                  - minor
                  - patch
          dependencies:
              dependency-type: production
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns:
                  - "*"

# The Dockerfile's Node, Alpine and pnpm versions are ARGs, which Dependabot's docker ecosystem can't bump; update them by hand
